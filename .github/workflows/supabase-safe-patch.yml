name: Apply Supabase Safe Patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/DRIVEDESK_FULL_SETUP.sql'
      - 'scripts/apply-supabase-sql.mjs'
      - '.github/workflows/supabase-safe-patch.yml'

jobs:
  apply-safe-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply safe patch
        run: npm run supabase:apply
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
