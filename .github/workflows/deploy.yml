name: Build and Deploy to Cloudflare Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_LOGIN: ${{ secrets.VITE_ADMIN_LOGIN }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_SUPERADMIN_LOGIN: ${{ secrets.VITE_SUPERADMIN_LOGIN }}
          VITE_SUPERADMIN_PASSWORD: ${{ secrets.VITE_SUPERADMIN_PASSWORD }}

      - name: Smoke local build
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vroom-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/vroom-preview.log
            exit 1
          fi
          SMOKE_BASE_URL=http://127.0.0.1:4173 npm run smoke:vroom

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Infrastructure-only legacy Cloudflare Pages project; vroom.today is attached to it.
          projectName: drivingschool
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
