name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Chromium for smoke checks
        run: npx playwright install --with-deps chromium

      - name: Smoke built app before deploy
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vroom-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              SMOKE_BASE_URL=http://127.0.0.1:4173 npm run smoke:vroom
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vroom-preview.log >&2 || true
          echo "Local preview did not become ready for smoke checks." >&2
          exit 1

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Infrastructure-only legacy Cloudflare Pages project; vroom.today is attached to it.
          projectName: drivingschool
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
